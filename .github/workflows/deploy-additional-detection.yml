name: Deploy Additional Disabled Detection

on:
  push:
    branches: [main]
    paths:
      - 'detections/azure/AZ-DET-002.*'
      - 'schemas/AZ-DET-002.schema.json'
      - 'scripts/deploy_additional_rule.py'
      - '.github/workflows/deploy-additional-detection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-lab-deployment
  cancel-in-progress: false

jobs:
  deploy-additional:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sentinel-lab
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_ADDITIONAL_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      SENTINEL_AZ_DET_002_APPROVED: ${{ vars.SENTINEL_AZ_DET_002_APPROVED }}
      AZURE_CORE_COLLECT_TELEMETRY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate both detections and run offline tests
        run: |
          python -m scripts.validate_detection
          python -m unittest discover -s tests -v
      - name: Check second-detection prerequisites
        run: python -m scripts.check_prerequisites --mode additional
      - name: Azure login using dedicated additional-rule identity
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_ADDITIONAL_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Deploy fixed disabled AZ-DET-002 and verify persisted Azure state
        run: python -m scripts.deploy_additional_rule
