name: Deploy Disabled Detection Portfolio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-lab-deployment
  cancel-in-progress: false

jobs:
  deploy-portfolio:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sentinel-lab
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      SENTINEL_EXCLUSIVE_RULE_OWNER: ${{ vars.SENTINEL_EXCLUSIVE_RULE_OWNER }}
      SENTINEL_PORTFOLIO_APPROVED_SHA256: ${{ vars.SENTINEL_PORTFOLIO_APPROVED_SHA256 }}
      AZURE_CORE_COLLECT_TELEMETRY: 'false'
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate fixed contracts, scenarios and deployment guards
        run: |
          python -m portfolio
          python -m scripts.validate_detection
          python -m unittest discover -s tests -v
          python -c "import os; from portfolio.catalog import validate; from scripts.validate_detection import require; require(os.environ.get('SENTINEL_PORTFOLIO_APPROVED_SHA256') == validate(), 'Approved portfolio fingerprint required')"
      - name: Login through existing OIDC identity
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Create fixed disabled rules and verify persisted REST responses
        run: python -m scripts.deploy_portfolio
