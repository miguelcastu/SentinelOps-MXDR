name: Deploy Approved Single Machine AMA Configuration

on:
  workflow_dispatch:
    inputs:
      confirm_fixed_configuration:
        description: 'Deploy only the approved owned-machine DCR, AMA extension and association; send no logs'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sentinel-lab-deployment
  cancel-in-progress: false

jobs:
  configure-ama:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false && inputs.confirm_fixed_configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sentinel-lab
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      SENTINEL_AMA_APPROVED_SHA256: ${{ vars.SENTINEL_AMA_APPROVED_SHA256 }}
      AZURE_CORE_COLLECT_TELEMETRY: 'false'
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate boundaries and exact approval before login
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.validate_detection
          python -c "import os; from ama.cloud import fingerprint; from scripts.validate_detection import require; require(os.environ.get('SENTINEL_AMA_APPROVED_SHA256') == fingerprint(), 'Exact AMA approval required')"
      - name: Login with existing OIDC identity
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Deploy only fixed AMA configuration and verify actual Azure REST
        run: python -m scripts.deploy_ama_pilot
