name: Offline Detection Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    # Standard hosted runners are free for this public repository.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate restricted REST schema and KQL
        run: python -m scripts.validate_detection
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic ingestion and triage offline
        run: |
          python -m ingestion
          python -m scripts.assess_detections
      - name: Validate platform health and safe fault injection offline
        run: python -m platform_health
      - name: Validate synthetic risk correlation and control scenarios offline
        run: python -m rba
