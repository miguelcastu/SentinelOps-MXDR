name: Deploy Sentinel Detection

on:
  push:
    branches: [main]
    paths:
      - 'detections/azure/AZ-DET-001.*'
      - 'schemas/scheduled-rule.schema.json'
      - 'scripts/deploy_rule.py'
      - 'scripts/azure_guard.py'
      - 'scripts/validate_detection.py'
      - 'scripts/check_prerequisites.py'
      - '.github/workflows/deploy-sentinel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-lab-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sentinel-lab
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      SENTINEL_RULE_ID: ${{ vars.SENTINEL_RULE_ID }}
      SENTINEL_DEPLOYMENT_APPROVED: ${{ vars.SENTINEL_DEPLOYMENT_APPROVED }}
      SENTINEL_EXCLUSIVE_RULE_OWNER: ${{ vars.SENTINEL_EXCLUSIVE_RULE_OWNER }}
      AZURE_CORE_COLLECT_TELEMETRY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate detection and run offline tests
        run: |
          python -m scripts.validate_detection
          python -m unittest discover -s tests -v
      - name: Check prerequisites before authentication
        run: python -m scripts.check_prerequisites --mode deploy
      - name: Azure login using dedicated OIDC identity
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Update existing disabled rule and verify Azure REST state
        run: python -m scripts.deploy_rule
